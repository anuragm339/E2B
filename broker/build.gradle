plugins {
    id 'io.micronaut.application' version '4.2.1'
    id 'groovy'
}

// Configure custom configurations for unit tests
configurations {
    unitTestImplementation.extendsFrom implementation
    unitTestRuntimeOnly.extendsFrom runtimeOnly
}

sourceSets {
    unitTest {
        groovy.srcDir 'src/unitTest/groovy'
        resources.srcDir 'src/unitTest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    integrationTest {
        groovy.srcDir 'src/integrationTest/groovy'
    }
    journeyTest {
        java.setSrcDirs(['src/systemTest/java'])
        groovy.setSrcDirs(['src/systemTest/groovy'])
        resources.setSrcDirs(['src/systemTest/resources'])
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    systemTest {
        java.setSrcDirs(['src/blackboxSystemTest/java'])
        groovy.setSrcDirs(['src/blackboxSystemTest/groovy'])
        resources.setSrcDirs(['src/blackboxSystemTest/resources'])
    }
}

dependencies {
    // Depend on all modules
    implementation project(':common')
    implementation project(':storage')
    implementation project(':network')
    implementation project(':pipe')

    // Micronaut
    implementation 'io.micronaut:micronaut-inject'
    implementation 'io.micronaut:micronaut-runtime'
    implementation 'io.micronaut:micronaut-http-server-netty'
    implementation 'io.micronaut:micronaut-http-client'

    // Jackson for JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.3'
    implementation 'io.micronaut:micronaut-jackson-databind'

    // YAML support
    runtimeOnly 'org.yaml:snakeyaml'

    // Scheduling
    annotationProcessor 'io.micronaut:micronaut-inject-java'
    implementation 'io.micronaut:micronaut-context'

    // Metrics - Prometheus & Micrometer
    implementation 'io.micronaut.micrometer:micronaut-micrometer-core'
    implementation 'io.micronaut.micrometer:micronaut-micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-core'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Management endpoints
    implementation 'io.micronaut:micronaut-management'

    // RocksDB for per-msgKey ACK store
    implementation 'org.rocksdb:rocksdbjni:8.10.0'

    // Unit test dependencies
    unitTestImplementation 'org.apache.groovy:groovy:4.0.15'
    unitTestImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
    unitTestImplementation 'net.bytebuddy:byte-buddy:1.14.9'
    unitTestImplementation 'org.objenesis:objenesis:3.3'
    unitTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Integration test dependencies
    integrationTestImplementation 'org.apache.groovy:groovy:4.0.15'
    integrationTestImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
    integrationTestImplementation 'io.micronaut.test:micronaut-test-spock'
    integrationTestImplementation 'io.micronaut:micronaut-inject-groovy'  // AST transforms for @MicronautTest on Groovy specs
    integrationTestImplementation 'net.bytebuddy:byte-buddy:1.14.9'
    integrationTestImplementation 'org.objenesis:objenesis:3.3'
    integrationTestImplementation 'org.xerial:sqlite-jdbc:3.45.1.0'  // SQLite driver for TestDataController tests
    integrationTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Journey test dependencies (in-process harness)
    journeyTestImplementation project(':test-consumer')
    journeyTestImplementation 'org.apache.groovy:groovy:4.0.15'
    journeyTestImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
    journeyTestImplementation 'io.micronaut.test:micronaut-test-spock'
    journeyTestImplementation 'io.micronaut:micronaut-inject-groovy'
    journeyTestImplementation 'net.bytebuddy:byte-buddy:1.14.9'
    journeyTestImplementation 'org.objenesis:objenesis:3.3'
    journeyTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // System test dependencies (separate-process black-box)
    systemTestImplementation project(':test-consumer')
    systemTestImplementation 'org.apache.groovy:groovy:4.0.15'
    systemTestImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
    systemTestImplementation 'net.bytebuddy:byte-buddy:1.14.9'
    systemTestImplementation 'org.objenesis:objenesis:3.3'
    systemTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Map test task to run unitTest source set
test {
    useJUnitPlatform()
    testClassesDirs = sourceSets.unitTest.output.classesDirs
    classpath = sourceSets.unitTest.runtimeClasspath
}

// integrationTest task already defined in root build.gradle

tasks.register('journeyTest', Test) {
    description = 'Runs in-process journey tests.'
    group = 'verification'
    testClassesDirs = sourceSets.journeyTest.output.classesDirs
    classpath = sourceSets.journeyTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter test
}

def toAbsoluteClasspath = { FileCollection files ->
    files.files.collect { it.absolutePath }.join(File.pathSeparator)
}

tasks.named('systemTest') {
    description = 'Runs separate-process black-box system tests.'
    shouldRunAfter tasks.named('journeyTest')
    systemProperty 'blackbox.broker.classpath', toAbsoluteClasspath(sourceSets.main.runtimeClasspath)
    systemProperty 'blackbox.consumer.classpath', toAbsoluteClasspath(project(':test-consumer').sourceSets.main.runtimeClasspath)
}

// The integrationTest resources dir is registered twice (root build.gradle + Gradle default convention),
// so we must declare a duplicates strategy to avoid a build error when any file is placed there.
processIntegrationTestResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processJourneyTestResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processSystemTestResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

application {
    mainClass = 'com.messaging.broker.Application'
}

micronaut {
    version = '4.2.1'
    runtime(io.micronaut.gradle.MicronautRuntime.NETTY)
}
