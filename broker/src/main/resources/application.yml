micronaut:
  application:
    name: messaging-broker
  server:
    port: ${HTTP_PORT:8082}  # HTTP admin port

  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        step: PT1M  # 1 minute scrape interval
        descriptions: true
    binders:
      jvm:
        enabled: true
      processor:
        enabled: true
      uptime:
        enabled: true
      files:
        enabled: true
      logback:
        enabled: true

endpoints:
  all:
    enabled: true
    # Sensitive by default: POS devices expose this port on store networks. Only the
    # endpoints monitoring actually scrapes are opened up explicitly below.
    sensitive: true
  prometheus:
    enabled: true
    sensitive: false
  health:
    enabled: true
    sensitive: false
  metrics:
    enabled: true
    sensitive: false

broker:
  nodeId: ${NODE_ID:local-001}

  registry:
    url: ${REGISTRY_URL:http://localhost:8080}
    auth:
      bearer-token: ${AUTH_BEARER_TOKEN:}  # Optional bearer token for registry and pipe HTTP calls

  storage:
    type: filechannel  # FileChannel-based (no mmap) for true zero-copy via sendfile()
    dataDir: ${DATA_DIR:/Users/anuragmishra/Desktop/workspace/messaging/data/}
    segment-size: ${SEGMENT_SIZE:104857600}  # 100MB default; override via SEGMENT_SIZE env var (e.g. 10485760 = 10MB for testing)
    flush-interval: ${STORAGE_FLUSH_INTERVAL:1s}  # Group-commit fsync cadence for the active segment (bounds power-cut data loss)
    # Page-cache control: after each flush, evict already-fsynced log pages older than this
    # tail from the OS page cache (posix_fadvise DONTNEED). Keeps Docker's reported memory
    # flat on constrained devices. Tail stays cached for consumer delivery. -1 disables.
    cache-drop-tail-keep-bytes: ${STORAGE_CACHE_DROP_TAIL_KEEP_BYTES:4194304}  # 4MB

  default-topic: ${DEFAULT_TOPIC:default-topic}

  network:
    type: tcp
    port: ${BROKER_PORT:19092}
    threads:
      boss: 1
      worker: 4   # Low-CPU profile: fewer Netty workers, lower parallelism during peaks

  consumer:
    default-retry-policy: EXPONENTIAL_THEN_FIXED
    default-max-exponential-retries: 10
    default-initial-retry-delay: 1000
    default-max-retry-delay: 30000
    default-fixed-retry-interval: 30000
    # ACK timeout in milliseconds - how long to wait for consumer to ACK a batch before reverting offset
    # Baseline: 60s works for most 1-2MB batches. Increase for larger batches or slower consumers.
    # If timeout fires frequently, increase this value or reduce batch size.
    ack-timeout: ${ACK_TIMEOUT_MS:120000}  # Low-CPU profile: tolerate slower/larger deliveries

    # Send timeout: how long the broker waits for the TCP transfer itself to complete.
    # Total = base + (batch size in MB × per-mb).
    # Example: a 50 MB batch → 1 + (50 × 2) = 101 seconds.
    # Raise per-mb-seconds for slow networks; raise base-seconds for high-latency links.
    send-timeout-base-seconds: ${SEND_TIMEOUT_BASE_SECONDS:1}
    send-timeout-per-mb-seconds: ${SEND_TIMEOUT_PER_MB_SECONDS:2}
    storage-read-timeout-seconds: ${STORAGE_READ_TIMEOUT_SECONDS:30}
    max-message-size-per-consumer: ${MAX_MESSAGE_SIZE_PER_CONSUMER:262144}  # 256KB default; below G1 humongous threshold (512KB with 1MB regions)
    # DEPRECATED: max-batch-size-per-consumer no longer used (size-only batching now)
    # max-batch-size-per-consumer: ${MAX_BATCH_SIZE_PER_CONSUMER:100}

    # Adaptive polling configuration (watermark-based delivery)
    adaptive-polling:
      min-delay-ms: 200        # Low-CPU profile: fewer successful polls, higher delivery latency
      max-delay-ms: 5000       # Longer backoff when idle to reduce scheduler wakeups

    # Per-topic fairness configuration
    fairness:
      threads: 2                  # Low-CPU profile: smaller scheduler pool
      max-in-flight-per-topic: 1  # Serialize per-topic delivery to reduce parallel work

  pipe:
    min-poll-interval-ms: ${PIPE_MIN_POLL_INTERVAL_MS:500}   # Low-CPU profile: less frequent upstream polling
    max-poll-interval-ms: ${PIPE_MAX_POLL_INTERVAL_MS:20000}
    poll-limit: ${PIPE_POLL_LIMIT:5}

# Legacy Client Configuration
# Maps legacy serviceName (from RegisterEvent) to list of topics
# Used by protocol adapter to auto-subscribe legacy clients
legacy-clients:
  enabled: ${LEGACY_CLIENTS_ENABLED:true}

  # Service to topics mapping
  # Key: serviceName (sent in RegisterEvent.clientId)
  # Value: list of topics to subscribe
  service-topics:
    price-quote:
      - prices-v1
      - reference-data-v5
      - non-promotable-products
      - prices-v4
      - minimum-price
      - deposit

    product-svc-lite:
      - product-base-document

    search-enterprise:
      - search-product

    tesco-location:
      - location
      - location-clusters

    customer-order-on-till:
      - selling-restrictions

    colleague-facts:
      - colleague-facts-jobs
      - colleague-facts-legacy

    loss-prevention-api:
      - loss-prevention-configuration
      - loss-prevention-store-configuration
      - loss-prevention-product
      - loss-prevention-rule-config

    stored-value-services:
      - stored-value-services-banned-promotion
      - stored-value-services-active-promotion

    colleague-identity:
      - colleague-card-pin

    distributed-identity:
      - colleague-card-pin-v2

    dcxp-content:
      - dcxp-content

    restriction-service-on-tills:
      - restriction-rules

    dcxp-ugc:
      - dcxp-ugc

executor:
  ack:
    threads: ${EXECUTOR_ACK_THREADS:2}
    queue-capacity: ${EXECUTOR_ACK_QUEUE_CAPACITY:1000}
  ack-storage:
    threads: ${EXECUTOR_ACK_STORAGE_THREADS:2}
    queue-capacity: ${EXECUTOR_ACK_STORAGE_QUEUE_CAPACITY:100}
  consumer-scheduler:
    threads: ${EXECUTOR_CONSUMER_SCHEDULER_THREADS:2}
  storage:
    threads: ${EXECUTOR_STORAGE_THREADS:2}
    queue-capacity: ${EXECUTOR_STORAGE_QUEUE_CAPACITY:100}

ack-store:
  # Backend selection. Supported: rocks (default), memory. New backends are added by implementing
  # com.messaging.broker.ack.AckStore and annotating with @Requires(property="ack-store.backend").
  backend: ${ACK_STORE_BACKEND:rocks}
  live-replay:
    enabled: ${ACK_STORE_LIVE_REPLAY_ENABLED:true}
  seed-on-startup:
    enabled: ${ACK_STORE_SEED_ON_STARTUP_ENABLED:true}
  rocksdb:
    path: ${DATA_DIR}/ack-store
    block-cache-bytes: ${ACK_STORE_BLOCK_CACHE_BYTES:16777216}   # 16MB total — single LRUCache shared by both CFs (was 2×32MB=64MB)
  reconciliation:
    interval: ${ACK_RECONCILIATION_INTERVAL:5m}
    initial-delay: ${ACK_RECONCILIATION_INITIAL_DELAY:2m}
    enabled: ${ACK_RECONCILIATION_ENABLED:true}
    auto-sync-enabled: ${ACK_RECONCILIATION_AUTO_SYNC:false}

# Pipe-consistency detection (detect-only audit of this node vs its parent / the cloud).
# Fail-closed: with enabled=false the served endpoints answer 404 (indistinguishable from an
# older build) and the admin trigger answers 503. Zero steady-state cost — nothing runs,
# nothing is stored, and the ingest/delivery hot paths are untouched, unless a check is
# explicitly triggered via POST /admin/pipe-consistency/check.
pipe:
  consistency:
    enabled: ${PIPE_CONSISTENCY_ENABLED:false}
    buckets: ${PIPE_CONSISTENCY_BUCKETS:64}                      # digest buckets; raise for multi-million-key topics
    scan-yield-every: ${PIPE_CONSISTENCY_SCAN_YIELD_EVERY:10000} # cooperative yield cadence during index scans
    max-drilldown-buckets: ${PIPE_CONSISTENCY_MAX_DRILLDOWN_BUCKETS:8}   # above this, report divergence without key-level detail
    max-classify-entries: ${PIPE_CONSISTENCY_MAX_CLASSIFY_ENTRIES:1000}  # cap per-check classification batch
    max-bucket-entries: ${PIPE_CONSISTENCY_MAX_BUCKET_ENTRIES:100000}    # server-side cap on one bucket response
    max-concurrent-scans: ${PIPE_CONSISTENCY_MAX_CONCURRENT_SCANS:2}     # parent-side guard; excess children get 429
    # Automatic detection — runs check?topic=all on a fixed cadence (only when enabled=true above).
    # Skips (never queues) when: a check is running, the parent is unassigned (offline POS),
    # or heap pressure is high. The admin API works regardless of schedule.enabled.
    schedule:
      enabled: ${PIPE_CONSISTENCY_SCHEDULE_ENABLED:true}
      interval: ${PIPE_CONSISTENCY_SCHEDULE_INTERVAL:6h}
      initial-delay: ${PIPE_CONSISTENCY_SCHEDULE_INITIAL_DELAY:10m}
      target: ${PIPE_CONSISTENCY_SCHEDULE_TARGET:parent}   # parent | cloud

compaction-index:
  # Backend selection. Supported: rocks (default), memory. New backends are added by implementing
  # com.messaging.broker.compaction.CompactionIndex and annotating with @Requires(property="compaction-index.backend").
  backend: ${COMPACTION_INDEX_BACKEND:rocks}

compaction:
  enabled: ${COMPACTION_ENABLED:true}
  tombstone-retention-days: ${COMPACTION_RETENTION_DAYS:7}
  window-size: ${COMPACTION_WINDOW_SIZE:10}  # Max sealed segments per compaction run (incremental)
  max-topics-per-run: ${COMPACTION_MAX_TOPICS_PER_RUN:2147483647}  # Use env to cap full-sweep breadth in constrained environments
  min-segments-per-topic: ${COMPACTION_MIN_SEGMENTS_PER_TOPIC:1}  # Avoid rewriting single sealed segments unless explicitly enabled
  max-process-cpu-usage: ${COMPACTION_MAX_PROCESS_CPU_USAGE:0.7}  # Skip compaction when broker CPU is already hot (1.0 disables the guard)
  max-heap-usage: ${COMPACTION_MAX_HEAP_USAGE:0.7}  # Skip compaction when heap pressure is already high (1.0 disables the guard)
  schedule:
    interval: ${COMPACTION_INTERVAL:24h}
    initial-delay: ${COMPACTION_INITIAL_DELAY:5m}

logger:
  levels:
    com.messaging: WARN  # Default to warnings/errors unless a package is explicitly promoted
    com.messaging.broker.core: INFO  # Broker lifecycle and orchestration
    com.messaging.broker.refresh: INFO  # Refresh workflow state changes
    com.messaging.broker.consumer: INFO  # Consumer lifecycle, timeouts, failures; hot-path batch logs stay DEBUG
    com.messaging.broker.handler: INFO  # Subscribe / READY_ACK / RESET_ACK lifecycle events
    com.messaging.broker.legacy: INFO  # Legacy consumer lifecycle; merge internals stay DEBUG
    com.messaging.broker.compaction: INFO  # Compaction run lifecycle, per-topic results, heap stats
    com.messaging.broker.consistency: INFO  # Pipe-consistency scheduled runs, per-topic verdicts
    com.messaging.pipe: INFO  # Pipe connect/pause/resume and failures; poll traffic stays DEBUG
    com.messaging.storage.segment: INFO  # Segment replace/remove events with offset and heap context
    io.netty: ERROR  # Only show Netty errors
